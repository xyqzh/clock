<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="description" content="此刻，一个简洁的本地时钟。实时显示手机的时间、日期与星期。">
    <title>此刻 · 本地时钟</title>
    <!-- PWA 与 iPhone 主屏启动配置 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="此刻">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <script>
        // 在样式加载前恢复主题和夜间状态，避免首屏颜色闪烁。
        (() => {
            // 未手动选择主题时跟随作息自动切换，夜间时段与 app.js 保持一致。
            let storedTheme = "auto";
            try {
                storedTheme = localStorage.getItem("moment-theme") || "auto";
            } catch (_) { }
            const hour = new Date().getHours();
            // 夜间时段：21:00 至次日 08:00。
            const isNight = hour >= 21 || hour < 8;
            const isAuto = storedTheme !== "dark" && storedTheme !== "light";
            const darkTheme = isAuto ? isNight : storedTheme === "dark";
            if (darkTheme) {
                document.documentElement.dataset.theme = "dark";
            }
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
                themeColor.setAttribute("content", darkTheme ? "#080a09" : "#f4f1e9");
            }
            if (isAuto) {
                document.documentElement.classList.add("is-auto-theme");
            }
            if (isNight) {
                document.documentElement.classList.add("is-night-dim");
            }
            const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (statusBar) statusBar.setAttribute("content", darkTheme ? "black-translucent" : "default");
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="lunar.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <main class="page">
        <h1 class="sr-only">此刻，本地时钟</h1>
        <!-- 整张卡片在手机端铺满视口，在桌面端居中显示 -->
        <section class="clock-panel" aria-label="本地时钟">
            <!-- 左侧：实时时间 -->
            <div class="clock-main">
                <div class="panel-top">
                    <span class="small-label" id="greeting">此刻时间</span>
                    <div class="panel-actions">
                        <span class="sr-only" id="theme-status" aria-live="polite"></span>
                        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题模式">
                            <span class="theme-auto-mark" aria-hidden="true">A</span>
                            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z" />
                            </svg>
                            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="4" />
                                <path
                                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                            </svg>
                        </button>
                        <div class="format-control" role="group" aria-label="时间格式">
                            <button type="button" data-format="24" aria-label="切换为12小时制">24 小时</button>
                        </div>
                        <button class="settings-toggle" id="settings-toggle" type="button" aria-label="显示设置"
                            aria-expanded="false" aria-controls="display-settings">
                            <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.4 7.4 0 0 0-1.7-.98L14.5 2.42A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42L9.13 5.07c-.61.25-1.18.58-1.7.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.09.73 1.7.98l.38 2.65A.49.49 0 0 0 10 22h4a.49.49 0 0 0 .49-.42l.38-2.65c.61-.25 1.18-.58 1.7-.98l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="display-settings" id="display-settings" hidden>
                    <label>
                        <span>时钟颜色</span>
                        <input id="font-color" type="color" value="#2c382e" aria-label="选择字体颜色">
                    </label>
                    <label>
                        <span>时钟大小</span>
                        <input id="font-size" type="range" min="80" max="130" step="1" value="100"
                            aria-label="调整字体大小">
                        <output id="font-size-value" for="font-size">100%</output>
                    </label>
                </div>
                <div class="time-wrap">
                    <span class="period" id="period" hidden></span>
                    <time id="time" class="time" aria-label="正在读取本地时间">
                        <span id="hours">--</span><span class="colon">:</span><span id="minutes">--</span>
                    </time>
                    <div class="seconds-group" aria-hidden="true"><span id="seconds">--</span><span
                            class="seconds-label">SEC</span></div>
                </div>
                <div class="clock-bottom"><span class="live"><i aria-hidden="true"></i>随设备时间实时更新</span><span
                        id="utc-offset">UTC</span></div>
            </div>
            <!-- 右侧：日期、农历、节气与节日 -->
            <div class="calendar">
                <div class="calendar-heading"><span class="small-label">今天</span><span class="calendar-icon"
                        aria-hidden="true"></span></div>
                <time id="date" class="date"><span id="month-year">正在读取日期</span><strong id="day">--</strong><span
                        id="weekday">星期 —</span></time>
                <p class="lunar-date" id="lunar-date">正在读取农历</p>
                <p class="day-note" id="day-note">正在读取节气与节日</p>
                <div class="calendar-foot" id="day-of-year">每一天，都是新的一页。</div>
            </div>
        </section>
        <noscript>
            <p class="notice">请开启浏览器 JavaScript，以显示实时本地时间。</p>
        </noscript>
    </main>
</body>

</html>
